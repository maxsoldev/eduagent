[project]
name = "educodex"
version = "0.1.0"
description = "An educational Python re-implementation of the OpenAI Codex harness"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "mcp>=1.2",
    "pyyaml>=6",
]

[project.scripts]
educodex = "educodex.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "textual>=0.80"]

[project.optional-dependencies]
tui = ["textual>=0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/educodex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
